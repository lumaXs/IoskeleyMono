name: Build and Release Font

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: iosevka-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Iosevka source
        uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          path: iosevka-src
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint python3 python3-pip fontforge
          pip3 install fonttools --break-system-packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build font
        run: |
          cp private-build-plans.toml iosevka-src/
          cd iosevka-src
          npm install
          npm run build -- \
            ttf::IoskeleyMono \
            ttf::IoskeleyMonoNL \
            ttf::IoskeleyMonoFixed

      - name: Verify build output
        run: |
          test -d iosevka-src/dist/IoskeleyMono/TTF
          test -d iosevka-src/dist/IoskeleyMonoNL/TTF
          test -d iosevka-src/dist/IoskeleyMonoFixed/TTF
          echo "Build output verified."

      - name: Download Nerd Fonts patcher
        run: |
          curl -sL "$(gh api repos/ryanoasis/nerd-fonts/releases/latest --jq '.assets[] | select(.name == "FontPatcher.zip") | .browser_download_url')" -o FontPatcher.zip
          unzip -q FontPatcher.zip -d nerd-fonts-patcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch fonts with Nerd Font glyphs
        shell: bash
        run: |
          set -e
          mkdir -p patched/IoskeleyMono \
                   patched/IoskeleyMonoNL \
                   patched/IoskeleyMonoFixed

          PATCHER="nerd-fonts-patcher/font-patcher"

          patch_family () {
            FAMILY="$1"
            echo "Patching $FAMILY..."
            find "iosevka-src/dist/$FAMILY/TTF" \
              -maxdepth 1 -type f -name "*.ttf" \
              | while read FONT; do
                fontforge -script "$PATCHER" \
                  "$FONT" --complete --careful \
                  --outputdir "patched/$FAMILY" 2>/dev/null
              done
            echo "Done: $FAMILY"
          }

          export -f patch_family

          patch_family "IoskeleyMono"      &
          patch_family "IoskeleyMonoNL"    &
          patch_family "IoskeleyMonoFixed" &
          wait
          echo "All families patched."

      - name: Fix Nerd Font icon sizes
        run: |
          mkdir -p fixed
          python3 fix-nerd-fonts.py patched fixed

      - name: Package release archives
        shell: bash
        run: |
          set -e
          mkdir -p release

          package_family () {
            FAMILY="$1"
            echo "Packaging $FAMILY..."
            mkdir -p "release/$FAMILY"
            find "fixed/$FAMILY" -type f -name "*.ttf" \
              -exec cp {} "release/$FAMILY/" \;
            cd release
            zip -r "${FAMILY}.zip" "$FAMILY"
            cd ..
          }

          package_family "IoskeleyMono"
          package_family "IoskeleyMonoNL"
          package_family "IoskeleyMonoFixed"

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
