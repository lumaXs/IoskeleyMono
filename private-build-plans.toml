# ============================================================
# IoskeleyMono — private-build-plans.toml
# Fork of https://github.com/ahatem/IoskeleyMono
#
# Baseado em análise de 4 toml reais com serifs = "slab":
#   1. viosevka (vednoc/viosevka)
#   2. IosevkaCr (be5invis/Iosevka issue #2735)
#   3. iosevka-comfy-motion (protesilaos/iosevka-comfy)
#   4. IosevkaCustom ss08 (be5invis/Iosevka issue #2434)
#
# Variantes:
#   IoskeleyMono       — spacing=term, ligaduras ativas
#   IoskeleyMonoNL     — spacing=term, sem ligaduras
#   IoskeleyMonoStrict — spacing=term, mais estrito que Normal,
#                        mantém ligaduras (substitui Fixed)
# ============================================================

[buildPlans.IoskeleyMono]
family = "Ioskeley Mono"
spacing = "term"
serifs = "slab"
noCvSs = true
exportGlyphNames = false

[buildPlans.IoskeleyMono.variants.design]
# ── Números ──────────────────────────────────────────────────
zero    = "dotted"
one     = "base-flat-top-serif"
two     = "straight-neck-serifed"
three   = "flat-top"
four    = "semi-open"
five    = "upright-arched-serifless"
six     = "closed-contour"
seven   = "bend-serifed"
eight   = "two-circles"
nine    = "closed-contour"

# ── Maiúsculas ────────────────────────────────────────────────
capital-a = "straight-tri-serifed"
capital-c = "bilateral-inward-serifed"
capital-g = "toothless-corner-inward-serifed-hooked"
capital-i = "serifed"
capital-j = "serifed-both-sides"
capital-q = "crossing"
capital-w = "straight-flat-top-serifless"

# ── Minúsculas ────────────────────────────────────────────────
a = "double-storey-serifed"
c = "bilateral-inward-serifed"
e = "flat-crossbar"
f = "flat-hook-serifed"
g = "single-storey-serifed"
i = "serifed"
j = "flat-hook-serifed"
l = "serifed"
r = "serifed"
t = "bent-hook"
y = "straight-serifed"

# ── Símbolos neutros ─────────────────────────────────────────
tittle             = "square"
diacritic-dot      = "square"
punctuation-dot    = "square"
tilde              = "low"
asterisk           = "penta-mid"
underscore         = "high"
caret              = "medium"
ascii-grave        = "straight"
ascii-single-quote = "straight"
paren              = "flat-arc"
brace              = "straight"
guillemet          = "straight"
number-sign        = "slanted"
ampersand          = "closed"
at                 = "fourfold"
dollar             = "through"
percent            = "rings-continuous-slash"
bar                = "natural-slope"
question           = "corner"
decorative-angle-brackets = "middle"

# ── Ligaduras ─────────────────────────────────────────────────
lig-ltgteq           = "slanted"
lig-neq              = "slightly-slanted"
lig-equal-chain      = "without-notch"
lig-hyphen-chain     = "without-notch"
lig-plus-chain       = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

# ============================================================
# WEIGHTS
# ============================================================

[buildPlans.IoskeleyMono.weights.Thin]
shape = 100
menu  = 100
css   = 100

[buildPlans.IoskeleyMono.weights.ExtraLight]
shape = 200
menu  = 200
css   = 200

[buildPlans.IoskeleyMono.weights.Light]
shape = 300
menu  = 300
css   = 300

[buildPlans.IoskeleyMono.weights.SemiLight]
shape = 350
menu  = 350
css   = 350

[buildPlans.IoskeleyMono.weights.Regular]
shape = 400
menu  = 400
css   = 400

[buildPlans.IoskeleyMono.weights.Medium]
shape = 500
menu  = 500
css   = 500

[buildPlans.IoskeleyMono.weights.SemiBold]
shape = 600
menu  = 600
css   = 600

[buildPlans.IoskeleyMono.weights.Bold]
shape = 700
menu  = 700
css   = 700

[buildPlans.IoskeleyMono.weights.ExtraBold]
shape = 800
menu  = 800
css   = 800

[buildPlans.IoskeleyMono.weights.Black]
shape = 900
menu  = 900
css   = 900

# ============================================================
# WIDTHS
# ============================================================

[buildPlans.IoskeleyMono.widths.Condensed]
shape = 480
menu  = 3
css   = "condensed"

[buildPlans.IoskeleyMono.widths.SemiCondensed]
shape = 540
menu  = 4
css   = "semi-condensed"

[buildPlans.IoskeleyMono.widths.Normal]
shape = 600
menu  = 5
css   = "normal"

# ============================================================
# SLOPES
# ============================================================

[buildPlans.IoskeleyMono.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.IoskeleyMono.slopes.Italic]
angle = 11.8
shape = "italic"
menu  = "italic"
css   = "italic"

# ============================================================
# NL — No Ligatures
# ============================================================

[buildPlans.IoskeleyMonoNL]
family          = "Ioskeley Mono NL"
spacing         = "term"
serifs          = "slab"
noCvSs          = true
noLigation      = true
exportGlyphNames = false

weights.inherits = "buildPlans.IoskeleyMono"
widths.inherits  = "buildPlans.IoskeleyMono"
slopes.inherits  = "buildPlans.IoskeleyMono"

[buildPlans.IoskeleyMonoNL.variants]
inherits = "buildPlans.IoskeleyMono"

# ============================================================
# Strict — spacing term mais estrito, COM ligaduras
# Substitui o Fixed (que era spacing=fixed e perdia ligaduras)
# ============================================================

[buildPlans.IoskeleyMonoFixed]
family          = "Ioskeley Mono Fixed"
spacing         = "term"
serifs          = "slab"
noCvSs          = true
exportGlyphNames = false

weights.inherits = "buildPlans.IoskeleyMono"
widths.inherits  = "buildPlans.IoskeleyMono"
slopes.inherits  = "buildPlans.IoskeleyMono"

[buildPlans.IoskeleyMonoFixed.variants]
inherits = "buildPlans.IoskeleyMono"
