# ============================================================
# IoskeleyMono — private-build-plans.toml
# Fork of https://github.com/ahatem/IoskeleyMono
#
# Fixes applied:
#   - spacing = "term" em todas as variantes
#   - serifs = "slab" em todas as variantes
#   - Removidas variantes "-serifless" do design que
#     conflitam com serifs = "slab" e causam Invalid proxy type
#   - Removido metricOverride com blend() incompatível
#   - IoskeleyMonoTerm removido (redundante)
#   - IoskeleyMonoFixed adicionado com spacing = "fixed"
# ============================================================

[buildPlans.IoskeleyMono]
family = "Ioskeley Mono"
spacing = "term"
serifs = "slab"
noCvSs = true
exportGlyphNames = false

[buildPlans.IoskeleyMono.variants.design]
one = "no-base"
two = "straight-neck"
three = "flat-top"
four = "semi-open"
five = "oblique-flat"
six = "open-contour"
seven = "straight"
eight = "two-circles"
nine = "open-contour"
zero = "dotted"

capital-a = "straight"
capital-b = "standard"
capital-c = "bilateral-inward-serifed"
capital-d = "standard"
capital-e = "standard"
capital-f = "standard"
capital-g = "toothless-corner-inward-serifed-hooked"
capital-h = "standard"
capital-i = "serifed"
capital-j = "standard"
capital-k = "symmetric-touching"
capital-l = "standard"
capital-m = "hanging"
capital-n = "standard"
capital-p = "closed"
capital-q = "crossing"
capital-r = "standing"
capital-s = "standard"
capital-t = "standard"
capital-u = "toothless-rounded"
capital-v = "straight"
capital-w = "straight-flat-top"
capital-x = "straight"
capital-y = "straight"
capital-z = "straight"

a = "double-storey"
b = "toothed"
c = "bilateral-inward-serifed"
d = "toothed"
e = "flat-crossbar"
f = "flat-hook-crossbar-at-x-height"
g = "single-storey"
h = "straight"
i = "serifed"
j = "flat-hook-serifed"
k = "symmetric-touching"
l = "serifed"
m = "standard"
n = "straight"
p = "eared"
q = "straight"
r = "hookless"
s = "standard"
t = "flat-hook-short-neck2"
u = "toothed"
v = "straight"
w = "straight-flat-top"
x = "straight"
y = "straight"
z = "straight"

lower-theta = "oval"
tittle = "square"
diacritic-dot = "square"
punctuation-dot = "square"
braille-dot = "square"
tilde = "low"
asterisk = "penta-mid"
underscore = "high"
caret = "medium"
ascii-grave = "straight"
ascii-single-quote = "straight"
paren = "flat-arc"
brace = "curly-flat-boundary"
guillemet = "straight"
number-sign = "slanted"
ampersand = "closed"
at = "fourfold"
dollar = "through"
cent = "through-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
question = "corner"
pilcrow = "high"
decorative-angle-brackets = "middle"
lig-ltgteq = "slanted"
lig-neq = "slightly-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

# ============================================================
# WEIGHTS
# ============================================================

[buildPlans.IoskeleyMono.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.IoskeleyMono.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.IoskeleyMono.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IoskeleyMono.weights.SemiLight]
shape = 350
menu = 350
css = 350

[buildPlans.IoskeleyMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IoskeleyMono.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IoskeleyMono.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IoskeleyMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IoskeleyMono.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.IoskeleyMono.weights.Black]
shape = 900
menu = 900
css = 900

# ============================================================
# WIDTHS
# ============================================================

[buildPlans.IoskeleyMono.widths.Condensed]
shape = 480
menu = 3
css = "condensed"

[buildPlans.IoskeleyMono.widths.SemiCondensed]
shape = 540
menu = 4
css = "semi-condensed"

[buildPlans.IoskeleyMono.widths.Normal]
shape = 600
menu = 5
css = "normal"

# ============================================================
# SLOPES
# ============================================================

[buildPlans.IoskeleyMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IoskeleyMono.slopes.Italic]
angle = 11.8
shape = "italic"
menu = "italic"
css = "italic"

# ============================================================
# NL VARIANT (No Ligatures)
# ============================================================

[buildPlans.IoskeleyMonoNL]
family = "Ioskeley Mono NL"
spacing = "term"
serifs = "slab"
noCvSs = true
noLigation = true
exportGlyphNames = false

weights.inherits = "buildPlans.IoskeleyMono"
widths.inherits = "buildPlans.IoskeleyMono"
slopes.inherits = "buildPlans.IoskeleyMono"

[buildPlans.IoskeleyMonoNL.variants]
inherits = "buildPlans.IoskeleyMono"

# ============================================================
# FIXED VARIANT
# ============================================================

[buildPlans.IoskeleyMonoFixed]
family = "Ioskeley Mono Fixed"
spacing = "fixed"
serifs = "slab"
noCvSs = true
exportGlyphNames = false

weights.inherits = "buildPlans.IoskeleyMono"
widths.inherits = "buildPlans.IoskeleyMono"
slopes.inherits = "buildPlans.IoskeleyMono"

[buildPlans.IoskeleyMonoFixed.variants]
inherits = "buildPlans.IoskeleyMono"
